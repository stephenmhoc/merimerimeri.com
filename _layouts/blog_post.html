---
layout: default
---

<nav class="site-nav" aria-label="Primary navigation">
  <a href="/">Home</a>
  <a href="/blog/">Writing</a>
</nav>

<article id="content" class="pb-16 h-entry">
  <header class="post-header">
    {% unless page.untitled %}<h1 class="p-name">{{ page.title }}</h1>{% endunless %}
    <p class="post-date"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%A, %B %-d, %Y" }}</time></p>
  </header>

  <div class="e-content">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
  <ul class="tag-list" aria-label="Tags">
    {% for tag in page.tags %}<li><span class="tag">{{ tag }}</span></li>{% endfor %}
  </ul>
  {% endif %}

  <p class="post-back"><a href="/blog/">← All writing</a></p>
</article>
